<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>¿Cuál es más?</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="anim.css">
<style>.barras{width:100%;max-width:520px;text-align:left;font-size:20px}
.fila{display:flex;align-items:center;gap:10px;margin:6px 0}.fila b{font-family:Kalam,cursive;color:var(--ink);font-size:30px;width:58px}
.tubo{flex:1;height:30px;border:3px solid var(--ink);border-radius:8px;overflow:hidden;background:#fff}
.lleno{height:100%;width:0;background:var(--or);transition:width 1.2s}</style>
</head>
<body>
<div class="wrap">
  <h1>🍕 <span>¿Cuál es más grande?</span></h1>
  <div class="pasos" id="pasos"></div>
  <div class="escena">
    <svg viewBox="0 0 600 290" id="sv"></svg>
    <div class="barras oculto" id="barras">
      <div class="fila"><b>3/5</b><div class="tubo"><div class="lleno" id="b1"></div></div></div>
      <div class="fila"><b>4/7</b><div class="tubo"><div class="lleno" id="b2"></div></div></div>
    </div>
  </div>
  <div class="texto" id="texto"></div>
  <div class="controles" id="controles"></div>
</div>
<script src="anim.js"></script>
<script>

const sv=A.$('sv');
const P=[A.pizza(sv,150,125,115,5),A.pizza(sv,450,125,115,7)];
const L=[150,450].map(x=>A.el('text',{x,y:282,'text-anchor':'middle',class:'etq'},sv));
A.iniciar([
 {n:'2 pizzas',t:'Tengo <u>2 pizzas iguales</u>.',s:'Del mismo tamaño',d:2500},
 {n:'Las parto',t:'Una la parto en <u>5</u> y la otra en <u>7</u>. ✂️',s:'Fíjate: las rebanadas de 5 son <b>más grandes</b>',d:3500},
 {n:'Me como',t:'De una me como <u>3 de 5</u>. De la otra, <u>4 de 7</u>. 😋',s:'¿De cuál comí más?',d:6000},
 {n:'Comparo',t:'<span style="color:#1f3a93">3/5</span> es más que <span style="color:#1f3a93">4/7</span> 🎉',s:'Por poquito. Con la cruz: 3 × 7 = <b>21</b> y 4 × 5 = <b>20</b>; gana 21'},
],(n,animar,later)=>{
  P.forEach(p=>{p.cortar(n>=1);for(let i=0;i<p.n;i++)p.comer(i,false)});
  L[0].textContent=n==0?'1 pizza':n==1?'5 partes':'3/5'; L[1].textContent=n==0?'1 pizza':n==1?'7 partes':'4/7';
  A.$('barras').classList.toggle('oculto',n!=3); A.$('b1').style.width=A.$('b2').style.width='0';
  if(n==3)later(150,()=>{A.$('b1').style.width='60%';A.$('b2').style.width='57.1%'});
  if(n>=2){const seq=[[0,0],[0,1],[0,2],[1,0],[1,1],[1,2],[1,3]];
    if(animar&&n==2)seq.forEach(([p,i],k)=>later(500+k*650,()=>P[p].comer(i)));else seq.forEach(([p,i])=>P[p].comer(i));}
});
</script>
</body>
</html>
