<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Número mixto</title>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Kalam:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="anim.css">
<style>.num{font:700 26px Kalam,cursive;fill:#fff;paint-order:stroke;stroke:#1f3a93;stroke-width:5;opacity:0;transition:opacity .3s}.num.on{opacity:1}</style>
</head>
<body>
<div class="wrap">
  <h1>🍕 <span>2 ¾ es lo mismo que 11/4</span></h1>
  <div class="pasos" id="pasos"></div>
  <div class="escena">
    <svg viewBox="0 0 600 250" id="sv"></svg>
    <div id="res" class="grande oculto">2 ¾ = 11/4</div>
  </div>
  <div class="texto" id="texto"></div>
  <div class="controles" id="controles"></div>
</div>
<script src="anim.js"></script>
<script>

const sv=A.$('sv'),X=[100,300,500];
const P=X.map(x=>A.pizza(sv,x,105,88,4));
const L=X.map(x=>A.el('text',{x,y:238,'text-anchor':'middle',class:'etq'},sv));
const nums=[];P.forEach((p,k)=>{for(let i=0;i<4;i++){if(k==2&&i==3)continue;const c=p.centro(i,.5);const t=A.el('text',{x:c[0],y:c[1]+9,'text-anchor':'middle',class:'num'},sv);t.textContent=nums.length+1;nums.push(t)}});
A.iniciar([
 {n:'Mis pizzas',t:'Tengo <u>2 pizzas enteras</u> y <u>3/4</u> de otra. 🍕',s:'Eso se escribe <b>2 ¾</b> (dos enteros y tres cuartos)',d:3000},
 {n:'En cuartos',t:'Parto <u>todas</u> en cuartos (4 partes). ✂️',s:'Cada pizza entera tiene 4 cuartos',d:3500},
 {n:'Cuento',t:'Cuento <u>todos los cuartos</u>.',s:'4 + 4 + 3',d:6500},
 {n:'Resultado',t:'Son <span style="color:#1f3a93">11 cuartos</span>: 2 ¾ = 11/4 🎉',s:'Atajo: 2 × 4 + 3 = <b>11</b>, y abajo se queda el <b>4</b>'},
],(n,animar,later)=>{
  P.forEach(p=>p.cortar(n>=1));P[2].cortar(true);P[2].quitar(3);
  L.forEach((t,i)=>t.textContent=n==0?['1','1','3/4'][i]:['4/4','4/4','3/4'][i]);
  nums.forEach(t=>t.classList.toggle('on',n>=3));
  A.$('res').classList.toggle('oculto',n!=3);if(n==3)A.pop(A.$('res'));
  if(n==2){if(animar)nums.forEach((t,i)=>later(400+i*500,()=>{t.classList.add('on')}));else nums.forEach(t=>t.classList.add('on'))}
});
</script>
</body>
</html>
