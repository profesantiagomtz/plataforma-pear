<svg xmlns="http://www.w3.org/2000/svg" width="680" height="230" viewBox="0 0 680 230" role="img"><rect width="680" height="230" fill="#ffffff"/><text x="150" y="34" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#1b1d2a" text-anchor="middle" font-weight="700">Partes de una potencia</text><text x="105" y="125" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="70" fill="#4f46e5" text-anchor="middle" font-weight="700">2</text><text x="150" y="78" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="38" fill="#d97706" text-anchor="middle" font-weight="700">5</text><text x="225" y="125" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="46" fill="#1b1d2a" text-anchor="middle" font-weight="700">= 32</text><text x="105" y="160" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14" fill="#4f46e5" text-anchor="middle" font-weight="700">base</text><text x="165" y="160" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13" fill="#d97706" text-anchor="middle" font-weight="700">exponente</text><text x="250" y="160" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14" fill="#1b1d2a" text-anchor="middle" font-weight="700">potencia</text><text x="150" y="205" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#1b1d2a" text-anchor="middle" font-weight="400">2⁵ = 2 × 2 × 2 × 2 × 2</text><text x="480" y="34" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#1b1d2a" text-anchor="middle" font-weight="700">Elevar al cuadrado = área de un cuadrado</text><rect x="340" y="168" width="22" height="22" fill="#4f46e5" fill-opacity=".35" stroke="#4f46e5"/><text x="351.0" y="212" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="13" fill="#1b1d2a" text-anchor="middle" font-weight="700">1² = 1</text><rect x="390" y="146" width="22" height="22" fill="#4f46e5" fill-opacity=".35" stroke="#4f46e5"/><rect x="390" y="168" width="22" height="22" fill="#4f46e5" fill-