<svg xmlns="http://www.w3.org/2000/svg" width="600" height="250" viewBox="0 0 600 250" role="img"><rect width="600" height="250" fill="#ffffff"/><text x="300" y="28" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#1b1d2a" text-anchor="middle" font-weight="700">Prefijos del Sistema Internacional</text><rect x="30" y="60" width="74" height="80" rx="10" fill="#eceafd" stroke="#4f46e5" stroke-width="2"/><text x="67" y="95" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="12.5" fill="#1b1d2a" text-anchor="middle" font-weight="700">kilo (k)</text><text x="67" y="118" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="10.5" fill="#6a6f85" text-anchor="middle" font-weight="400">10³ = 1 000</text><rect x="110" y="60" width="74" height="80" rx="10" fill="#eceafd" stroke="#4f46e5" stroke-width="2"/><text x="147" y="95" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="12.5" fill="#1b1d2a" text-anchor="middle" font-weight="700">hecto (h)</text><text x="147" y="118" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="10.5" fill="#6a6f85" text-anchor="middle" font-weight="400">10² = 100</text><rect x="190" y="60" width="74" height="80" rx="10" fill="#eceafd" stroke="#4f46e5" stroke-width="2"/><text x="227" y="95" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="12.5" fill="#1b1d2a" text-anchor="middle" font-weight="700">deca (da)</text><text x="227" y="118" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="10.5" fill="#6a6f85" text-anchor="middle" font-weight="400">10¹ = 10</text><rect x="270" y="60" width="74" height="80" rx="10" fill="#4f46e5" stroke="#4f46e5" stroke-width="2"/><text x="307" y="95" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="12.5" fill="#fff" text-anchor="middle" font-weight="700">UNIDAD</text><text x="307" y="118" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="10.5" fill="#fff" text-anchor="middle" font-weight="400">m · g · L</text><rect x="350" y="60" width="74" height="80" rx="10" fill="#eceafd" stroke="#4f46e5" stroke-width="2"/><text x="387" y="95" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="12.5" fill="#1b1d2a" text-anchor="middle" font-weight="700">deci (d)</text><text x="387" y="118" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="10.5" fill="#6a6f85" text-anchor="middle" font-weight="400">10⁻¹ = 0.1</text><rect x="430" y="60" width="74" height="80" rx="10" fill="#eceafd" stroke="#4f46e5" stroke-width="2"/><text x="467" y="95" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="12.5" fill="#1b1d2a" text-anchor="middle" font-weight="700">centi (c)</text><text x="467" y="118" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="10.5" fill="#6a6f85" text-anchor="middle" font-weight="400">10⁻² = 0.01</text><rect x="510" y="60" width="74" height="80" rx="10" fill="#eceafd" stroke="#4f46e5" stroke-width="2"/><text x="547" y="95" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="12.5" fill="#1b1d2a" text-anchor="middle" font-weight="700">mili (m)</text><text x="547" y="118" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="10.5" fill="#6a6f85" text-anchor="middle" font-weight="400">10⁻³ = 0.001</text><line x1="40" y1="168" x2="560" y2="168" stroke="#0f9d58" stroke-width="3"/><path d="M560 168 l-10 -6 v12z" fill="#0f9d58"/><text x="300" y="190" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="12.5" fill="#0f9d58" text-anchor="middle" font-weight="700">Hacia la derecha: × 10 por cada escalón</text><line x1="560" y1="210" x2="40" y2="210" stroke="#d97706" stroke-width="3"/><path d="M40 210 l10 -6 v12z" fill="#d97706"/><text x="300" y="232" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="12.5" fill="#d97706" text-anchor="middle" font-weight="700">Hacia la izquierda: ÷ 10 por cada escalón</text></svg>