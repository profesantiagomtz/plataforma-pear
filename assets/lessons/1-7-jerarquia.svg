<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img"><rect width="600" height="320" fill="#ffffff"/><text x="300" y="28" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#1b1d2a" text-anchor="middle" font-weight="700">Jerarquía de operaciones</text><rect x="30" y="45" width="540" height="48" rx="10" fill="#4f46e5" fill-opacity=".14" stroke="#4f46e5" stroke-width="2"/><circle cx="58" cy="69" r="15" fill="#4f46e5"/><text x="58" y="75" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">1</text><text x="85" y="67" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14" fill="#1b1d2a" text-anchor="start" font-weight="700">Paréntesis ( ), corchetes [ ], llaves { }</text><text x="85" y="84" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="12" fill="#6a6f85" text-anchor="start" font-weight="400">de adentro hacia afuera</text><rect x="50" y="103" width="520" height="48" rx="10" fill="#d97706" fill-opacity=".14" stroke="#d97706" stroke-width="2"/><circle cx="78" cy="127" r="15" fill="#d97706"/><text x="78" y="133" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">2</text><text x="105" y="132" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14" fill="#1b1d2a" text-anchor="start" font-weight="700">Potencias y raíces</text><rect x="70" y="161" width="500" height="48" rx="10" fill="#0f9d58" fill-opacity=".14" stroke="#0f9d58" stroke-width="2"/><circle cx="98" cy="185" r="15" fill="#0f9d58"/><text x="98" y="191" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">3</text><text x="125" y="183" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14" fill="#1b1d2a" text-anchor="start" font-weight="700">Multiplicación × y división ÷</text><text x="125" y="200" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="12" fill="#6a6f85" text-anchor="start" font-weight="400">de izquierda a derecha</text><rect x="90" y="219" width="480" height="48" rx="10" fill="#db2777" fill-opacity=".14" stroke="#db2777" stroke-width="2"/><circle cx="118" cy="243" r="15" fill="#db2777"/><text x="118" y="249" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="16" fill="#fff" text-anchor="middle" font-weight="700">4</text><text x="145" y="241" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14" fill="#1b1d2a" text-anchor="start" font-weight="700">Suma + y resta −</text><text x="145" y="258" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="12" fill="#6a6f85" text-anchor="start" font-weight="400">de izquierda a derecha</text><text x="300" y="298" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="12.5" fill="#1b1d2a" text-anchor="middle" font-weight="700">Ejemplo: 3 + 2 × (5 − 1)² ÷ 4  →  3 + 2 × 16 ÷ 4  →  3 + 32 ÷ 4  →  3 + 8  =  11</text></svg>