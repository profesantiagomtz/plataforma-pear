<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 740 255" role="img"><rect width="740" height="255" fill="#ffffff"/><clipPath id="c0"><circle cx="120" cy="130" r="70"/></clipPath><circle cx="200" cy="130" r="70" fill="#4f46e5" fill-opacity=".35" clip-path="url(#c0)"/><circle cx="120" cy="130" r="70" fill="none" stroke="#4f46e5" stroke-width="2.5"/><circle cx="200" cy="130" r="70" fill="none" stroke="#4f46e5" stroke-width="2.5"/><text x="90" y="135" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="20" fill="#1b1d2a" text-anchor="middle" font-weight="700">p</text><text x="230" y="135" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="20" fill="#1b1d2a" text-anchor="middle" font-weight="700">q</text><text x="160" y="40" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#1b1d2a" text-anchor="middle" font-weight="700">Conjunción: p y q  (p ∧ q)</text><text x="160" y="235" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="12.5" fill="#6a6f85" text-anchor="middle" font-weight="400">Verdadera cuando ambas son verdaderas</text><clipPath id="c380"><circle cx="500" cy="130" r="70"/></clipPath><circle cx="500" cy="130" r="70" fill="#4f46e5" fill-opacity=".35"/><circle cx="580" cy="130" r="70" fill="#4f46e5" fill-opacity=".35"/><circle cx="500" cy="130" r="70" fill="none" stroke="#4f46e5" stroke-width="2.5"/><circle cx="580" cy="130" r="70" fill="none" stroke="#4f46e5" stroke-width="2.5"/><text x="470" y="135" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="20" fill="#1b1d2a" text-anchor="middle" font-weight="700">p</text><text x="610" y="135" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="20" fill="#1b1d2a" text-anchor="middle" font-weight="700">q</text><text x="540" y="40" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="15" fill="#1b1d2a" text-anchor="middle" font-weight="700">Disyunción: p o q  (p ∨ q)</text><text x="540" y="235" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="12.5" fill="#6a6f85" text-anchor="middle" font-weight="400">Verdadera cuando al menos una es verdadera</text></svg>