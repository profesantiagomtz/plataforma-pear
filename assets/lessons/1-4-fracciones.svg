rtes</text><rect x="110" y="275" width="360" height="30" fill="#fff" stroke="#1b1d2a" stroke-width="1.5"/><rect x="110" y="275" width="270" height="30" fill="#0f9d58" fill-opacity=".55" stroke="#1b1d2a" stroke-width="1.5"/><text x="110.0" y="322" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="12" fill="#6a6f85" text-anchor="middle" font-weight="400">0 %</text><text x="200.0" y="322" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="12" fill="#6a6f85" text-anchor="middle" font-weight="400">25 %</text><text x="290.0" y="322" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="12" fill="#6a6f85" text-anchor="middle" font-weight="400">50 %</text><text x="380.0" y="322" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="12" fill="#6a6f85" text-anchor="middle" font-weight="400">75 %</text><text x="470.0" y="322" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="12" fill="#6a6f85" text-anchor="middle" font-weight="400">100 %</text><text x="290" y="345" font-family="system-ui,Segoe UI,Arial,sans-serif" font-size="14" fill="#1b1d2a" text-anchor="middle" font-weight="700">75 % = 75/100 = 3/4 = 0.75</text></svg>